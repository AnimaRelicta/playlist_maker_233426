[project]
name = "playlist-maker-tools"
version = "1.0.0"
description = "Development helpers for the Kotlin Android application"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
android-project = "tools.project:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
]
